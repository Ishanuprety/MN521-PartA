!
! ==============================================================================
! MN521 Part A - BR-EDGE (Cisco c7200, Dynamips)
!
! Role   : Branch office gateway. 802.1Q router-on-a-stick gateway for VLAN 40
!          (branch staff) and VLAN 50 (guest), DHCP for both, first-hop guest
!          containment, ABR between OSPF area 0 and area 30, and the only site
!          with two WAN uplinks.
!
! Slots  : 0 = C7200-IO-FE (Fa0/0), 1/2/3 = PA-FE-TX (Fa1/0, Fa2/0, Fa3/0)
! Paths  : Fa0/0 -> DC-EDGE Fa1/0                  10.255.0.4/30  primary, cost 1
!          Fa2/0 -> WAN-Cloud -> HQ-CORE Fa3/0     10.255.0.20/30 backup, cost 50
!          Fa3/0 -> SW-BR-DIST Eth0  802.1Q trunk, VLANs 40/50 tagged
!          Fa1/0 -> SW-BR-1 Eth0     CABLED BUT SHUT - see below
!
! LOOP AVOIDANCE: SW-BR-1 is reachable both directly (Fa1/0) and through
! SW-BR-DIST. The GNS3 built-in Ethernet switch has no spanning tree, so Fa1/0 is
! held administratively down and the hierarchical path through SW-BR-DIST is the
! live one. This is the expected state, not a missed "no shutdown".
!
! WHY COST 50 ON THE BACKUP: with every link at FastEthernet speed the default
! OSPF cost is a uniform 1, which would make the direct Branch-to-HQ-CORE path
! SHORTER than the path through the Data Centre and steal all Branch traffic away
! from the DC-EDGE policy enforcement point. Cost 50 keeps the Data Centre path
! primary while the backup still takes over within OSPF convergence time.
! See docs/REVIEW_FINDINGS.md R-05.
!
! Notes  : ASCII only. FastEthernet only. No exec-mode commands.
! ==============================================================================
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
hostname BR-EDGE
!
clock timezone AEST 10 0
!
enable secret Cisco123!
username admin privilege 15 secret Cisco123!
!
ip domain-name corp.local
ip domain-lookup
ip domain-lookup source-interface Loopback0
ip cef
!
no ip http server
no ip http secure-server
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
login on-failure log
login on-success log
!
archive
 log config
  logging enable
  hidekeys
  notify syslog contenttype plaintext
!
! ------------------------------------------------------------------ ACLs -----
!
ip access-list extended ACL_VTY
 remark SSH accepted only from the named management hosts and the DC server VLAN.
 permit tcp host 10.10.99.10 any eq 22
 permit tcp host 10.10.99.11 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny   ip any any log
!
ip access-list extended ACL_GUEST_IN
 remark Applied inbound on Fa3/0.50 - the FIRST Layer 3 hop for guest traffic, so
 remark denied packets never enter the WAN and consume no backbone bandwidth.
 remark
 remark Service definition: guests get Internet access and name resolution, and
 remark nothing else. ENTRY ORDER IS THE DESIGN - DHCP, DNS and gateway ICMP are
 remark permitted ABOVE the deny rules. Move them below and the guest network is
 remark dead rather than merely restricted.
 permit udp any eq bootpc any eq bootps
 permit udp 10.30.50.0 0.0.0.255 host 10.20.30.10 eq domain
 permit tcp 10.30.50.0 0.0.0.255 host 10.20.30.10 eq domain
 permit icmp 10.30.50.0 0.0.0.255 host 10.30.50.1
 remark Every enterprise zone is denied BY NAME, including the branch's own
 remark staff VLAN and the DMZ. A deny-list has to be extended whenever a zone
 remark is added to the network - see docs/REVIEW_FINDINGS.md R-06 for the defect
 remark this ordering was written to fix.
 deny   ip 10.30.50.0 0.0.0.255 10.10.0.0 0.0.255.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.20.0.0 0.0.255.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.30.0.0 0.0.255.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.60.60.0 0.0.0.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.255.0.0 0.0.0.255 log
 remark Internet only, translated by PAT on FW-EDGE.
 permit ip 10.30.50.0 0.0.0.255 any
 deny   ip any any log
!
! ------------------------------------------------------------ INTERFACES -----
!
interface Loopback0
 description RID_BR-EDGE_AND_LOGGING_SOURCE
 ip address 3.3.3.3 255.255.255.255
!
interface FastEthernet0/0
 description WAN_PRIMARY_TO_DC-EDGE_Fa1/0_10.255.0.4/30
 ip address 10.255.0.6 255.255.255.252
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 no ip proxy-arp
 no shutdown
!
interface FastEthernet1/0
 description CABLED_TO_SW-BR-1_Eth0_HELD_DOWN_NO_STP_SEE_HEADER
 no ip address
 shutdown
!
interface FastEthernet2/0
 description WAN_BACKUP_VIA_WAN-Cloud_TO_HQ-CORE_Fa3/0_10.255.0.20/30_COST_50
 ip address 10.255.0.22 255.255.255.252
 ip ospf cost 50
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 no ip proxy-arp
 no shutdown
!
interface FastEthernet3/0
 description TRUNK_802.1Q_TO_SW-BR-DIST_Eth0_VLANS_40_50_TAGGED
 no ip address
 no shutdown
!
interface FastEthernet3/0.40
 description BRANCH_STAFF_VLAN40_GATEWAY_PC3_PC6_PC7
 encapsulation dot1Q 40
 ip address 10.30.40.1 255.255.255.0
 no ip proxy-arp
 no ip redirects
!
interface FastEthernet3/0.50
 description BRANCH_GUEST_VLAN50_GATEWAY_PC4_PC9_ISOLATED
 encapsulation dot1Q 50
 ip address 10.30.50.1 255.255.255.0
 ip access-group ACL_GUEST_IN in
 no ip proxy-arp
 no ip redirects
 no cdp enable
!
! ------------------------------------------------------------------ DHCP -----
!
ip dhcp excluded-address 10.30.40.1 10.30.40.20
ip dhcp excluded-address 10.30.50.1 10.30.50.20
!
ip dhcp pool VLAN40_BR_STAFF
 network 10.30.40.0 255.255.255.0
 default-router 10.30.40.1
 dns-server 10.20.30.10
 domain-name corp.local
 option 42 ip 10.20.30.11
 lease 2
!
! The guest scope is deliberately different from every corporate scope, and each
! difference is a control: a four-hour lease matches transient devices and stops
! the pool being exhausted by visitors who have left; the distinct domain name
! makes a guest lease self-evident from the client side, which is the simplest
! proof that scope separation works; and no option 42 is offered because guests
! have no reason to be handed the enterprise time source.
ip dhcp pool VLAN50_BR_GUEST
 network 10.30.50.0 255.255.255.0
 default-router 10.30.50.1
 dns-server 10.20.30.10
 domain-name guest.corp.local
 lease 0 4
!
! --------------------------------------------------------------- ROUTING -----
!
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes detail
 area 0 authentication message-digest
 passive-interface default
 no passive-interface FastEthernet0/0
 no passive-interface FastEthernet2/0
 network 3.3.3.3 0.0.0.0 area 30
 network 10.255.0.4 0.0.0.3 area 0
 network 10.255.0.20 0.0.0.3 area 0
 network 10.30.40.0 0.0.0.255 area 30
 network 10.30.50.0 0.0.0.255 area 30
!
! -------------------------------------------------- INFRASTRUCTURE SERVICES --
!
ip name-server 10.20.30.10
!
ntp server 10.20.30.11 prefer
ntp source Loopback0
ntp update-calendar
!
logging buffered 16384 informational
logging trap informational
logging origin-id hostname
logging source-interface Loopback0
logging host 10.20.30.12
!
! ----------------------------------------------------------- MANAGEMENT ------
!
banner login ^
MN521 Enterprise Network - AUTHORISED ACCESS ONLY
All access is logged to 10.20.30.12 and may be audited.
^
banner motd ^
BR-EDGE - Branch gateway / DHCP / guest containment / OSPF ABR area 30
Unauthorized access prohibited
^
!
line console 0
 exec-timeout 15 0
 logging synchronous
 login local
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
