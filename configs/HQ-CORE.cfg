!
! ==============================================================================
! MN521 Part A - HQ-CORE (Cisco c7200, Dynamips)
! Role   : Internet edge (NAT/PAT), OSPF area 0 backbone, default-route origin
! Slots  : 0 = C7200-IO-FE (Fa0/0), 1 = PA-FE-TX (Fa1/0), 2 = PA-FE-TX (Fa2/0)
! Notes  : ASCII only, FastEthernet only, no crypto key generation at boot.
!          Generate the SSH host key after first boot - see README section
!          "Post-boot SSH enablement".
! ==============================================================================
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
hostname HQ-CORE
!
clock timezone AEST 10 0
!
enable secret Cisco123!
username admin privilege 15 secret Cisco123!
!
no ip domain-lookup
ip domain-name corp.local
ip cef
!
no ip http server
no ip http secure-server
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
login on-failure log
login on-success log
!
archive
 log config
  logging enable
  hidekeys
  notify syslog contenttype plaintext
!
! ------------------------------------------------------------------ ACLs -----
! Defined before the interfaces / NAT statements that reference them.
!
ip access-list standard ACL_NAT_INSIDE
 remark Enterprise site prefixes translated by PAT toward the Internet
 permit 10.10.0.0 0.0.255.255
 permit 10.20.0.0 0.0.255.255
 permit 10.30.0.0 0.0.255.255
!
ip access-list extended ACL_VTY
 remark SSH management restricted to HQ mgmt VLAN 99 and DC server VLAN 30
 permit tcp 10.10.99.0 0.0.0.255 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny   ip any any log
!
ip access-list extended ACL_INTERNET_IN
 remark Anti-spoofing plus management-plane block on the untrusted NAT edge.
 remark Return traffic for PAT sessions is still permitted by the final entry.
 deny   ip 10.0.0.0 0.255.255.255 any log
 deny   ip 127.0.0.0 0.255.255.255 any log
 deny   ip 169.254.0.0 0.0.255.255 any log
 deny   tcp any any eq 22 log
 deny   tcp any any eq telnet log
 permit ip any any
!
! ------------------------------------------------------------ INTERFACES -----
!
interface Loopback0
 description ROUTER_ID_AND_LOGGING_SOURCE
 ip address 1.1.1.1 255.255.255.255
!
interface FastEthernet0/0
 description NAT_OUTSIDE_TO_GNS3_NAT_CLOUD
 ip address dhcp
 ip nat outside
 ip access-group ACL_INTERNET_IN in
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 no shutdown
!
interface FastEthernet1/0
 description WAN_TO_DC-EDGE_Fa0/0_10.255.0.0/30
 ip address 10.255.0.1 255.255.255.252
 ip nat inside
 no ip proxy-arp
 no shutdown
!
interface FastEthernet2/0
 description WAN_TO_HQ-DIST_Fa0/0_10.255.0.8/30
 ip address 10.255.0.9 255.255.255.252
 ip nat inside
 no ip proxy-arp
 no shutdown
!
! --------------------------------------------------------------- ROUTING -----
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes detail
 passive-interface default
 no passive-interface FastEthernet1/0
 no passive-interface FastEthernet2/0
 network 1.1.1.1 0.0.0.0 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.8 0.0.0.3 area 0
 default-information originate always
!
! DHCP on Fa0/0 also installs a default route; this static candidate keeps the
! backbone default stable if the NAT cloud lease is renewed or delayed.
ip route 0.0.0.0 0.0.0.0 FastEthernet0/0 dhcp
!
! ------------------------------------------------------------------- NAT -----
!
ip nat inside source list ACL_NAT_INSIDE interface FastEthernet0/0 overload
!
! -------------------------------------------------- INFRASTRUCTURE SERVICES --
!
ip name-server 10.20.30.10
!
ntp server 10.20.30.11 prefer
ntp update-calendar
!
logging buffered 16384 informational
logging trap informational
logging source-interface Loopback0
logging host 10.20.30.12
!
! ----------------------------------------------------------- MANAGEMENT ------
!
banner login ^
MN521 Enterprise Network - AUTHORISED ACCESS ONLY
All access is logged to 10.20.30.12 and may be audited.
^
banner motd ^
HQ-CORE - Internet edge / NAT / OSPF area 0 - Unauthorized access prohibited
^
!
line console 0
 exec-timeout 15 0
 logging synchronous
 login local
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
