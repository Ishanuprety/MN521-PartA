!
! ==============================================================================
! MN521 Part A - HQ-CORE (Cisco c7200, Dynamips)
!
! Role   : OSPF area 0 backbone core. Pure transit: no NAT, no host VLANs, no
!          external route origination. Four adjacencies make it the hub of the
!          backbone - FW-EDGE, DC-EDGE, HQ-DIST and the BR-EDGE backup link.
!
! Slots  : 0 = C7200-IO-FE (Fa0/0), 1/2/3 = PA-FE-TX (Fa1/0, Fa2/0, Fa3/0)
! Paths  : Fa0/0 -> FW-EDGE Fa1/0        10.255.0.16/30  (Internet via the edge)
!          Fa1/0 -> DC-EDGE Fa0/0        10.255.0.0/30
!          Fa2/0 -> HQ-DIST Fa0/0        10.255.0.8/30
!          Fa3/0 -> WAN-Cloud -> BR-EDGE Fa2/0  10.255.0.20/30  (backup, cost 50)
!
! IMPORTANT - this file supersedes the earlier revision that ran "ip nat outside"
! and "ip address dhcp" on Fa0/0. NAT now lives on FW-EDGE and Fa0/0 is a routed
! /30 to it. If a device in the lab still shows NAT on Fa0/0 it is running the
! superseded config and must be re-applied. See docs/REVIEW_FINDINGS.md R-01.
!
! Notes  : ASCII only. FastEthernet only. No exec-mode commands.
! ==============================================================================
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
hostname HQ-CORE
!
clock timezone AEST 10 0
!
enable secret Cisco123!
username admin privilege 15 secret Cisco123!
!
ip domain-name corp.local
ip domain-lookup
ip domain-lookup source-interface Loopback0
ip cef
!
no ip http server
no ip http secure-server
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
login on-failure log
login on-success log
!
archive
 log config
  logging enable
  hidekeys
  notify syslog contenttype plaintext
!
! ------------------------------------------------------------------ ACLs -----
!
ip access-list extended ACL_VTY
 remark SSH accepted only from the named management hosts and the DC server VLAN.
 permit tcp host 10.10.99.10 any eq 22
 permit tcp host 10.10.99.11 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny   ip any any log
!
ip access-list extended ACL_WAN_BR_IN
 remark Branch guest containment, second enforcement point.
 remark
 remark This ACL is applied on EVERY WAN interface a Branch-sourced packet can
 remark arrive on - DC-EDGE Fa1/0 (primary path) and HQ-CORE Fa3/0 (backup path
 remark via WAN-Cloud). Applying it only on the primary path would mean the
 remark control silently disappears the moment OSPF failed over to the backup
 remark link. See docs/REVIEW_FINDINGS.md R-05.
 remark
 remark OSPF is permitted explicitly rather than relying on the trailing permit,
 remark so the adjacency survives any future tightening of the tail.
 permit ospf any any
 permit udp 10.30.50.0 0.0.0.255 host 10.20.30.10 eq domain
 permit tcp 10.30.50.0 0.0.0.255 host 10.20.30.10 eq domain
 deny   ip 10.30.50.0 0.0.0.255 10.10.0.0 0.0.255.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.20.0.0 0.0.255.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.60.60.0 0.0.0.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.255.0.0 0.0.0.255 log
 permit ip any any
!
! ------------------------------------------------------------ INTERFACES -----
!
interface Loopback0
 description RID_HQ-CORE_AND_LOGGING_SOURCE
 ip address 1.1.1.1 255.255.255.255
!
interface FastEthernet0/0
 description WAN_TO_FW-EDGE_Fa1/0_10.255.0.16/30_INTERNET_VIA_EDGE
 ip address 10.255.0.18 255.255.255.252
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 no ip proxy-arp
 no shutdown
!
interface FastEthernet1/0
 description WAN_PRIMARY_TO_DC-EDGE_Fa0/0_10.255.0.0/30
 ip address 10.255.0.1 255.255.255.252
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 no ip proxy-arp
 no shutdown
!
interface FastEthernet2/0
 description WAN_TO_HQ-DIST_Fa0/0_10.255.0.8/30
 ip address 10.255.0.9 255.255.255.252
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 no ip proxy-arp
 no shutdown
!
interface FastEthernet3/0
 description WAN_BACKUP_VIA_WAN-Cloud_TO_BR-EDGE_Fa2/0_10.255.0.20/30_COST_50
 ip address 10.255.0.21 255.255.255.252
 ip ospf cost 50
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 ip access-group ACL_WAN_BR_IN in
 no ip proxy-arp
 no shutdown
!
! --------------------------------------------------------------- ROUTING -----
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes detail
 area 0 authentication message-digest
 passive-interface default
 no passive-interface FastEthernet0/0
 no passive-interface FastEthernet1/0
 no passive-interface FastEthernet2/0
 no passive-interface FastEthernet3/0
 network 1.1.1.1 0.0.0.0 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.8 0.0.0.3 area 0
 network 10.255.0.16 0.0.0.3 area 0
 network 10.255.0.20 0.0.0.3 area 0
!
! No "default-information originate" and no static default route here. HQ-CORE
! learns 0.0.0.0/0 as O*E2 from FW-EDGE, which is the single ASBR. Keeping the
! origination on one device means "show ip route 0.0.0.0" is unambiguous evidence
! of where Internet traffic leaves the enterprise.
!
! -------------------------------------------------- INFRASTRUCTURE SERVICES --
!
ip name-server 10.20.30.10
!
ntp server 10.20.30.11 prefer
ntp source Loopback0
ntp update-calendar
!
logging buffered 16384 informational
logging trap informational
logging origin-id hostname
logging source-interface Loopback0
logging host 10.20.30.12
!
! ----------------------------------------------------------- MANAGEMENT ------
!
banner login ^
MN521 Enterprise Network - AUTHORISED ACCESS ONLY
All access is logged to 10.20.30.12 and may be audited.
^
banner motd ^
HQ-CORE - OSPF area 0 backbone core - Unauthorized access prohibited
^
!
line console 0
 exec-timeout 15 0
 logging synchronous
 login local
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
