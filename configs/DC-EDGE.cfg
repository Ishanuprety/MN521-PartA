!
! ==============================================================================
! MN521 Part A - DC-EDGE (Cisco c7200, Dynamips)
! Role   : Data Centre gateway and primary WAN transit for the Branch.
!          Two server tiers: VLAN 30 infrastructure, VLAN 31 application.
!          DHCP for both server VLANs, ABR between area 0 and area 20.
! Slots  : 0 = C7200-IO-FE (Fa0/0), 1/2 = PA-FE-TX (Fa1/0, Fa2/0)
! Notes  : ASCII only, FastEthernet only, no exec-mode commands.
!          Fa1/0 carries ACL_WAN_BR_IN, which is also applied on HQ-CORE Fa3/0
!          so branch guest policy survives a failover onto the backup path.
! ==============================================================================
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
hostname DC-EDGE
!
clock timezone AEST 10 0
!
enable secret Cisco123!
username admin privilege 15 secret Cisco123!
!
ip domain-name corp.local
ip domain-lookup
ip domain-lookup source-interface Loopback0
ip cef
!
no ip http server
no ip http secure-server
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
login on-failure log
login on-success log
!
archive
 log config
  logging enable
  hidekeys
  notify syslog contenttype plaintext
!
! ------------------------------------------------------------------ ACLs -----
!
ip access-list extended ACL_VTY
 remark SSH from the named management hosts and the DC infrastructure VLAN only
 permit tcp host 10.10.99.10 any eq 22
 permit tcp host 10.10.99.11 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny   ip any any log
!
ip access-list extended ACL_WAN_BR_IN
 remark Branch guest isolation, enforced on every WAN interface a branch packet
 remark can arrive on, so the control does not depend on the path OSPF chooses.
 remark Guests may resolve names against the DC DNS server and nothing else.
 permit ospf any any
 permit udp 10.30.50.0 0.0.0.255 host 10.20.30.10 eq domain
 permit tcp 10.30.50.0 0.0.0.255 host 10.20.30.10 eq domain
 deny   ip 10.30.50.0 0.0.0.255 10.10.0.0 0.0.255.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.20.0.0 0.0.255.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.40.0.0 0.0.255.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.255.0.0 0.0.255.255 log
 permit ip any any
!
ip access-list extended ACL_DC_APP_IN
 remark East-west containment for the application tier. These are servers: they
 remark answer clients and patch themselves, but must never initiate a session
 remark into a user, management, guest or DMZ zone.
 permit udp any eq bootpc any eq bootps
 remark Replies to clients anywhere in the enterprise, above the zone denies
 permit tcp 10.20.31.0 0.0.0.255 any established
 permit icmp 10.20.31.0 0.0.0.255 any echo-reply
 permit icmp 10.20.31.0 0.0.0.255 any unreachable
 remark No server-initiated session toward a client zone
 deny   ip 10.20.31.0 0.0.0.255 10.10.0.0 0.0.255.255 log
 deny   ip 10.20.31.0 0.0.0.255 10.30.0.0 0.0.255.255 log
 deny   ip 10.20.31.0 0.0.0.255 10.40.0.0 0.0.255.255 log
 remark Intra-Data-Centre traffic and Internet egress for patching
 permit ip 10.20.31.0 0.0.0.255 any
 deny   ip any any log
!
! ------------------------------------------------------------ INTERFACES -----
!
interface Loopback0
 description ROUTER_ID_AND_LOGGING_SOURCE
 ip address 2.2.2.2 255.255.255.255
!
interface FastEthernet0/0
 description WAN_TO_HQ-CORE_Fa1/0_10.255.0.0/30
 ip address 10.255.0.2 255.255.255.252
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 no ip proxy-arp
 no shutdown
!
interface FastEthernet1/0
 description WAN_TO_BR-EDGE_Fa0/0_10.255.0.4/30_PRIMARY_BRANCH_PATH
 ip address 10.255.0.5 255.255.255.252
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 ip access-group ACL_WAN_BR_IN in
 no ip proxy-arp
 no shutdown
!
interface FastEthernet2/0
 description TRUNK_802.1Q_TO_SW-DC-CORE_PORT0_VLANS_30_31
 no ip address
 no shutdown
!
interface FastEthernet2/0.30
 description DC_INFRASTRUCTURE_VLAN30_GATEWAY_DNS_NTP_SYSLOG
 encapsulation dot1Q 30
 ip address 10.20.30.1 255.255.255.0
 no ip proxy-arp
 no ip redirects
!
interface FastEthernet2/0.31
 description DC_APPLICATION_VLAN31_GATEWAY_APP-SRV_FILE-SRV
 encapsulation dot1Q 31
 ip address 10.20.31.1 255.255.255.0
 ip access-group ACL_DC_APP_IN in
 no ip proxy-arp
 no ip redirects
!
! ------------------------------------------------------------------ DHCP -----
!
ip dhcp excluded-address 10.20.30.1 10.20.30.20
ip dhcp excluded-address 10.20.31.1 10.20.31.20
!
! Both server VLANs are statically addressed in production, so these pools are
! expected to show zero leases. They exist for transient test and staging hosts.
ip dhcp pool VLAN30_DC_INFRA
 network 10.20.30.0 255.255.255.0
 default-router 10.20.30.1
 dns-server 10.20.30.10
 domain-name corp.local
 option 42 ip 10.20.30.11
 lease 7
!
ip dhcp pool VLAN31_DC_APP
 network 10.20.31.0 255.255.255.0
 default-router 10.20.31.1
 dns-server 10.20.30.10
 domain-name corp.local
 option 42 ip 10.20.30.11
 lease 7
!
! --------------------------------------------------------------- ROUTING -----
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes detail
 area 0 authentication message-digest
 passive-interface default
 no passive-interface FastEthernet0/0
 no passive-interface FastEthernet1/0
 network 2.2.2.2 0.0.0.0 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.4 0.0.0.3 area 0
 network 10.20.30.0 0.0.0.255 area 20
 network 10.20.31.0 0.0.0.255 area 20
!
! -------------------------------------------------- INFRASTRUCTURE SERVICES --
!
ip name-server 10.20.30.10
!
ntp server 10.20.30.11 prefer
ntp source Loopback0
ntp update-calendar
!
logging buffered 16384 informational
logging trap informational
logging source-interface Loopback0
logging host 10.20.30.12
!
! ----------------------------------------------------------- MANAGEMENT ------
!
banner login ^
MN521 Enterprise Network - AUTHORISED ACCESS ONLY
All access is logged to 10.20.30.12 and may be audited.
^
banner motd ^
DC-EDGE - Data Centre gateway / WAN transit / OSPF ABR area 20 - Unauthorized access prohibited
^
!
line console 0
 exec-timeout 15 0
 logging synchronous
 login local
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
