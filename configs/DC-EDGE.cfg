!
hostname DC-EDGE
!
no ip domain-lookup
ip domain-name corp.local
!
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
!
service password-encryption
!
ip ssh version 2
!
line vty 0 4
 login local
 transport input ssh
!
line console 0
 logging synchronous
!
banner motd ^
MN521 Enterprise — DC-EDGE — Unauthorized access prohibited
^
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
!
interface FastEthernet0/0
 description WAN_TO_HQ-CORE
 ip address 10.255.0.2 255.255.255.252
 no shutdown
!
interface FastEthernet1/0
 description WAN_TO_BR-EDGE
 ip address 10.255.0.5 255.255.255.252
 no shutdown
!
interface FastEthernet2/0
 description TRUNK_TO_SW-DC-1
 no shutdown
!
interface FastEthernet2/0.30
 encapsulation dot1Q 30
 ip address 10.20.30.1 255.255.255.0
!
ip dhcp excluded-address 10.20.30.1 10.20.30.20
!
ip dhcp pool VLAN30
 network 10.20.30.0 255.255.255.0
 default-router 10.20.30.1
 dns-server 10.20.30.10
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 network 2.2.2.2 0.0.0.0 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.4 0.0.0.3 area 0
 network 10.20.30.0 0.0.0.255 area 20
!
ip name-server 10.20.30.10
ntp server 10.20.30.11
logging host 10.20.30.12
!
! ACL: allow servers, block guest subnet from DC
ip access-list extended ACL_DC_IN
 deny ip 10.30.50.0 0.0.0.255 10.20.30.0 0.0.0.255
 permit ip any any
interface FastEthernet1/0
 ip access-group ACL_DC_IN in
!
ip access-list extended ACL_VTY
 permit tcp 10.10.99.0 0.0.0.255 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny ip any any
line vty 0 4
 access-class ACL_VTY in
!
end
