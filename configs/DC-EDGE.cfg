!
! ==============================================================================
! MN521 Part A - DC-EDGE (Cisco c7200, Dynamips)
!
! Role   : Data Centre gateway and the primary WAN transit for the Branch.
!          802.1Q router-on-a-stick gateway for VLAN 30 (server farm), DHCP for
!          transient server-VLAN hosts, ABR between OSPF area 0 and area 20, and
!          the primary-path enforcement point for Branch guest containment.
!
! Slots  : 0 = C7200-IO-FE (Fa0/0), 1/2/3 = PA-FE-TX (Fa1/0, Fa2/0, Fa3/0)
! Paths  : Fa0/0 -> HQ-CORE Fa1/0     10.255.0.0/30
!          Fa1/0 -> BR-EDGE Fa0/0     10.255.0.4/30  (primary Branch path)
!          Fa3/0 -> SW-DC-CORE Eth0   802.1Q trunk, VLAN 30 tagged
!          Fa2/0 -> SW-DC-1 Eth0      CABLED BUT SHUT - see below
!
! LOOP AVOIDANCE: SW-DC-1 is reachable both directly (Fa2/0) and through
! SW-DC-CORE. The GNS3 built-in Ethernet switch has no spanning tree, so Fa2/0 is
! held administratively down and the hierarchical path through SW-DC-CORE is the
! live one. This is the expected state, not a missed "no shutdown".
!
! VLAN 30 hosts DNS (.10), NTP (.11), Syslog (.12), FILE-SRV (.13) and MON-SRV
! (.14) - the services every router in the enterprise depends on. Placing them
! behind the WAN transit router puts them at the topological centre of the
! network, one hop from HQ and one hop from the Branch.
!
! Notes  : ASCII only. FastEthernet only. No exec-mode commands.
! ==============================================================================
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
hostname DC-EDGE
!
clock timezone AEST 10 0
!
enable secret Cisco123!
username admin privilege 15 secret Cisco123!
!
ip domain-name corp.local
ip domain-lookup
ip domain-lookup source-interface Loopback0
ip cef
!
no ip http server
no ip http secure-server
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
login on-failure log
login on-success log
!
archive
 log config
  logging enable
  hidekeys
  notify syslog contenttype plaintext
!
! ------------------------------------------------------------------ ACLs -----
!
ip access-list extended ACL_VTY
 remark SSH accepted only from the named management hosts and the DC server VLAN.
 permit tcp host 10.10.99.10 any eq 22
 permit tcp host 10.10.99.11 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny   ip any any log
!
ip access-list extended ACL_WAN_BR_IN
 remark Branch guest containment, second enforcement point. Identical to the
 remark instance on HQ-CORE Fa3/0 so the policy is the same whichever WAN path
 remark OSPF has selected. See docs/REVIEW_FINDINGS.md R-05.
 remark
 remark Guests may resolve names against the DC DNS server - and only that. The
 remark DNS permits sit above the deny entries, which is what makes guest name
 remark resolution work while ICMP to the same host is refused.
 permit ospf any any
 permit udp 10.30.50.0 0.0.0.255 host 10.20.30.10 eq domain
 permit tcp 10.30.50.0 0.0.0.255 host 10.20.30.10 eq domain
 deny   ip 10.30.50.0 0.0.0.255 10.10.0.0 0.0.255.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.20.0.0 0.0.255.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.60.60.0 0.0.0.255 log
 deny   ip 10.30.50.0 0.0.0.255 10.255.0.0 0.0.0.255 log
 permit ip any any
!
! ------------------------------------------------------------ INTERFACES -----
!
interface Loopback0
 description RID_DC-EDGE_AND_LOGGING_SOURCE
 ip address 2.2.2.2 255.255.255.255
!
interface FastEthernet0/0
 description WAN_TO_HQ-CORE_Fa1/0_10.255.0.0/30
 ip address 10.255.0.2 255.255.255.252
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 no ip proxy-arp
 no shutdown
!
interface FastEthernet1/0
 description WAN_PRIMARY_TO_BR-EDGE_Fa0/0_10.255.0.4/30
 ip address 10.255.0.5 255.255.255.252
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 ip access-group ACL_WAN_BR_IN in
 no ip proxy-arp
 no shutdown
!
interface FastEthernet2/0
 description CABLED_TO_SW-DC-1_Eth0_HELD_DOWN_NO_STP_SEE_HEADER
 no ip address
 shutdown
!
interface FastEthernet3/0
 description TRUNK_802.1Q_TO_SW-DC-CORE_Eth0_VLAN_30_TAGGED
 no ip address
 no shutdown
!
interface FastEthernet3/0.30
 description DC_SERVERS_VLAN30_GATEWAY_DNS_NTP_SYSLOG_FILE_MON
 encapsulation dot1Q 30
 ip address 10.20.30.1 255.255.255.0
 no ip proxy-arp
 no ip redirects
!
! ------------------------------------------------------------------ DHCP -----
!
ip dhcp excluded-address 10.20.30.1 10.20.30.20
!
! The five production servers on VLAN 30 are statically addressed in .10-.14, so
! this pool is expected to show ZERO leases in steady state. It exists for the
! staging ports provisioned on SW-DC-2, where a transient test or replacement
! host can be attached without a router change. Zero leases here is the correct
! result, not a fault.
ip dhcp pool VLAN30_DC_SERVERS
 network 10.20.30.0 255.255.255.0
 default-router 10.20.30.1
 dns-server 10.20.30.10
 domain-name corp.local
 option 42 ip 10.20.30.11
 lease 7
!
! --------------------------------------------------------------- ROUTING -----
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes detail
 area 0 authentication message-digest
 passive-interface default
 no passive-interface FastEthernet0/0
 no passive-interface FastEthernet1/0
 network 2.2.2.2 0.0.0.0 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.4 0.0.0.3 area 0
 network 10.20.30.0 0.0.0.255 area 20
!
! Loopback0 sits in area 0 here, because DC-EDGE holds two backbone interfaces
! and its only site-local segment is the server VLAN. HQ-DIST and BR-EDGE place
! their loopbacks in their site areas instead. The consequence is visible in the
! routing table - 2.2.2.2/32 appears as intra-area O on backbone routers while
! 1.1.1.4/32 and 3.3.3.3/32 appear as inter-area O IA - and is called out in
! verification/CHECKS.md so it reads as a decision rather than an inconsistency.
!
! -------------------------------------------------- INFRASTRUCTURE SERVICES --
!
ip name-server 10.20.30.10
!
ntp server 10.20.30.11 prefer
ntp source Loopback0
ntp update-calendar
!
logging buffered 16384 informational
logging trap informational
logging origin-id hostname
logging source-interface Loopback0
logging host 10.20.30.12
!
! ----------------------------------------------------------- MANAGEMENT ------
!
banner login ^
MN521 Enterprise Network - AUTHORISED ACCESS ONLY
All access is logged to 10.20.30.12 and may be audited.
^
banner motd ^
DC-EDGE - Data Centre gateway / WAN transit / OSPF ABR area 20
Unauthorized access prohibited
^
!
line console 0
 exec-timeout 15 0
 logging synchronous
 login local
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
