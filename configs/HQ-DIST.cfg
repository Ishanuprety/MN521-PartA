!
hostname HQ-DIST
!
no ip domain-lookup
ip domain-name corp.local
!
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
!
service password-encryption
!
ip ssh version 2
!
line vty 0 4
 login local
 transport input ssh
!
line console 0
 logging synchronous
!
banner motd ^
MN521 Enterprise — HQ-DIST — Unauthorized access prohibited
^
!
interface Loopback0
 ip address 1.1.1.4 255.255.255.255
!
interface FastEthernet0/0
 description UPLINK_TO_HQ-CORE
 ip address 10.255.0.10 255.255.255.252
 no shutdown
!
interface FastEthernet1/0
 description TRUNK_TO_SW-HQ-1
 no shutdown
!
interface FastEthernet1/0.10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
!
interface FastEthernet1/0.20
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
!
interface FastEthernet1/0.99
 encapsulation dot1Q 99
 ip address 10.10.99.1 255.255.255.0
!
interface FastEthernet2/0
 description TRUNK_TO_SW-HQ-2
 no shutdown
!
interface FastEthernet2/0.10
 encapsulation dot1Q 10
! secondary trunk path — no IP (avoid duplicate subnet)
!
interface FastEthernet2/0.20
 encapsulation dot1Q 20
!
interface FastEthernet2/0.99
 encapsulation dot1Q 99
!
ip dhcp excluded-address 10.10.10.1 10.10.10.20
ip dhcp excluded-address 10.10.20.1 10.10.20.20
ip dhcp excluded-address 10.10.99.1 10.10.99.20
!
ip dhcp pool VLAN10
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 10.20.30.10
!
ip dhcp pool VLAN20
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
 dns-server 10.20.30.10
!
ip dhcp pool VLAN99
 network 10.10.99.0 255.255.255.0
 default-router 10.10.99.1
 dns-server 10.20.30.10
!
router ospf 1
 router-id 1.1.1.4
 log-adjacency-changes
 network 1.1.1.4 0.0.0.0 area 10
 network 10.255.0.8 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 10
 network 10.10.20.0 0.0.0.255 area 10
 network 10.10.99.0 0.0.0.255 area 10
!
ip name-server 10.20.30.10
ntp server 10.20.30.11
logging host 10.20.30.12
!
ip access-list extended ACL_VTY
 permit tcp 10.10.99.0 0.0.0.255 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny ip any any
!
line vty 0 4
 access-class ACL_VTY in
!
end
