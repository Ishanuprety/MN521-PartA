!
! ==============================================================================
! MN521 Part A - HQ-DIST (Cisco c7200, Dynamips)
! Role   : HQ distribution layer - 802.1Q router-on-a-stick for VLAN 10/20/99,
!          DHCP server for the two user VLANs, ABR between area 0 and area 10
! Slots  : 0 = C7200-IO-FE (Fa0/0), 1/2 = PA-FE-TX (Fa1/0, Fa2/0)
! Notes  : ASCII only, FastEthernet only, no exec-mode commands.
!          Fa1/0 is the single 802.1Q trunk to SW-HQ-1. Fa2/0 is a reserved
!          growth trunk and is deliberately shut down.
!          VLAN 99 has NO DHCP pool: the management VLAN is static-only, because
!          it is the subnet ACL_VTY trusts. See docs/REVIEW_FINDINGS.md R-07.
! ==============================================================================
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
hostname HQ-DIST
!
clock timezone AEST 10 0
!
enable secret Cisco123!
username admin privilege 15 secret Cisco123!
!
ip domain-name corp.local
ip domain-lookup
ip domain-lookup source-interface Loopback0
ip cef
!
no ip http server
no ip http secure-server
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
login on-failure log
login on-success log
!
archive
 log config
  logging enable
  hidekeys
  notify syslog contenttype plaintext
!
! ------------------------------------------------------------------ ACLs -----
!
ip access-list extended ACL_VTY
 remark SSH from the named management hosts and the DC infrastructure VLAN only
 permit tcp host 10.10.99.10 any eq 22
 permit tcp host 10.10.99.11 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny   ip any any log
!
ip access-list extended ACL_HQ_USERS_IN
 remark VLAN 10 users must not reach the HQ management VLAN, which holds the
 remark automation host and its router credentials. Everything else is allowed.
 remark The DHCP permit uses "any" as its source because a DISCOVER comes from
 remark 0.0.0.0, and it must sit above the deny entries.
 permit udp any eq bootpc any eq bootps
 deny   ip 10.10.10.0 0.0.0.255 10.10.99.0 0.0.0.255 log
 permit ip 10.10.10.0 0.0.0.255 any
 deny   ip any any log
!
! ------------------------------------------------------------ INTERFACES -----
!
interface Loopback0
 description ROUTER_ID_AND_LOGGING_SOURCE
 ip address 1.1.1.4 255.255.255.255
!
interface FastEthernet0/0
 description UPLINK_TO_HQ-CORE_Fa2/0_10.255.0.8/30
 ip address 10.255.0.10 255.255.255.252
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 no ip proxy-arp
 no shutdown
!
interface FastEthernet1/0
 description TRUNK_802.1Q_TO_SW-HQ-1_PORT0_VLANS_10_20_99
 no ip address
 no shutdown
!
interface FastEthernet1/0.10
 description HQ_USERS_VLAN10_GATEWAY
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip access-group ACL_HQ_USERS_IN in
 no ip proxy-arp
 no ip redirects
!
interface FastEthernet1/0.20
 description HQ_CORPORATE_VLAN20_GATEWAY
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 no ip proxy-arp
 no ip redirects
!
interface FastEthernet1/0.99
 description HQ_MANAGEMENT_VLAN99_GATEWAY_STATIC_ONLY
 encapsulation dot1Q 99
 ip address 10.10.99.1 255.255.255.0
 no ip proxy-arp
 no ip redirects
!
interface FastEthernet2/0
 description RESERVED_GROWTH_TRUNK_FOR_FUTURE_HQ_ACCESS_BLOCK
 no ip address
 shutdown
!
! ------------------------------------------------------------------ DHCP -----
!
ip dhcp excluded-address 10.10.10.1 10.10.10.20
ip dhcp excluded-address 10.10.20.1 10.10.20.20
!
ip dhcp pool VLAN10_HQ_USERS
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 10.20.30.10
 domain-name corp.local
 option 42 ip 10.20.30.11
 lease 2
!
ip dhcp pool VLAN20_HQ_CORP
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
 dns-server 10.20.30.10
 domain-name corp.local
 option 42 ip 10.20.30.11
 lease 2
!
! --------------------------------------------------------------- ROUTING -----
!
router ospf 1
 router-id 1.1.1.4
 log-adjacency-changes detail
 area 0 authentication message-digest
 passive-interface default
 no passive-interface FastEthernet0/0
 network 1.1.1.4 0.0.0.0 area 10
 network 10.255.0.8 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 10
 network 10.10.20.0 0.0.0.255 area 10
 network 10.10.99.0 0.0.0.255 area 10
!
! -------------------------------------------------- INFRASTRUCTURE SERVICES --
!
ip name-server 10.20.30.10
!
ntp server 10.20.30.11 prefer
ntp source Loopback0
ntp update-calendar
!
logging buffered 16384 informational
logging trap informational
logging source-interface Loopback0
logging host 10.20.30.12
!
! ----------------------------------------------------------- MANAGEMENT ------
!
banner login ^
MN521 Enterprise Network - AUTHORISED ACCESS ONLY
All access is logged to 10.20.30.12 and may be audited.
^
banner motd ^
HQ-DIST - HQ inter-VLAN routing / DHCP / OSPF ABR area 10 - Unauthorized access prohibited
^
!
line console 0
 exec-timeout 15 0
 logging synchronous
 login local
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
