!
! ==============================================================================
! MN521 Part A - HQ-DIST (Cisco c7200, Dynamips)
!
! Role   : HQ distribution layer. 802.1Q router-on-a-stick providing the
!          inter-VLAN gateways for VLAN 10 (users), 20 (corporate) and
!          99 (management), DHCP for the two user VLANs, and the ABR function
!          between OSPF area 0 and area 10.
!
! Slots  : 0 = C7200-IO-FE (Fa0/0), 1/2/3 = PA-FE-TX (Fa1/0, Fa2/0, Fa3/0)
! Paths  : Fa0/0 -> HQ-CORE Fa2/0   10.255.0.8/30
!          Fa2/0 -> SW-HQ-DIST Eth0 802.1Q trunk, VLANs 10/20/99 tagged
!          Fa1/0 -> SW-HQ-1 Eth0    CABLED BUT SHUT - see below
!
! LOOP AVOIDANCE: SW-HQ-1 is reachable both directly (Fa1/0) and through
! SW-HQ-DIST. The GNS3 built-in Ethernet switch has no spanning tree, so exactly
! one of those paths may be active. Fa1/0 is held administratively down and the
! hierarchical path through SW-HQ-DIST is the live one. This is the expected
! state, not a missed "no shutdown".
!
! VLAN 99 has NO DHCP pool. It is the subnet ACL_VTY trusts to administer every
! router, so hosts on it are named individually instead of being auto-addressed.
! See docs/REVIEW_FINDINGS.md R-08.
!
! Notes  : ASCII only. FastEthernet only. No exec-mode commands.
! ==============================================================================
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
hostname HQ-DIST
!
clock timezone AEST 10 0
!
enable secret Cisco123!
username admin privilege 15 secret Cisco123!
!
ip domain-name corp.local
ip domain-lookup
ip domain-lookup source-interface Loopback0
ip cef
!
no ip http server
no ip http secure-server
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
login on-failure log
login on-success log
!
archive
 log config
  logging enable
  hidekeys
  notify syslog contenttype plaintext
!
! ------------------------------------------------------------------ ACLs -----
!
ip access-list extended ACL_VTY
 remark SSH accepted only from the named management hosts and the DC server VLAN.
 permit tcp host 10.10.99.10 any eq 22
 permit tcp host 10.10.99.11 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny   ip any any log
!
ip access-list extended ACL_HQ_USERS_IN
 remark Applied inbound on Fa2/0.10. Ordinary user workstations have no business
 remark reaching the management VLAN, which holds AUTO-SRV and JUMP-SRV and
 remark therefore the credentials for every router in the estate.
 remark
 remark The DHCP permit must come first and must source from "any", because a
 remark DHCP DISCOVER is sourced from 0.0.0.0 before the host has an address.
 permit udp any eq bootpc any eq bootps
 deny   ip 10.10.10.0 0.0.0.255 10.10.99.0 0.0.0.255 log
 permit ip 10.10.10.0 0.0.0.255 any
 deny   ip any any log
!
! ------------------------------------------------------------ INTERFACES -----
!
interface Loopback0
 description RID_HQ-DIST_AND_LOGGING_SOURCE
 ip address 1.1.1.4 255.255.255.255
!
interface FastEthernet0/0
 description UPLINK_TO_HQ-CORE_Fa2/0_10.255.0.8/30
 ip address 10.255.0.10 255.255.255.252
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 no ip proxy-arp
 no shutdown
!
interface FastEthernet1/0
 description CABLED_TO_SW-HQ-1_Eth0_HELD_DOWN_NO_STP_SEE_HEADER
 no ip address
 shutdown
!
interface FastEthernet2/0
 description TRUNK_802.1Q_TO_SW-HQ-DIST_Eth0_VLANS_10_20_99_TAGGED
 no ip address
 no shutdown
!
interface FastEthernet2/0.10
 description HQ_USERS_VLAN10_GATEWAY_PC1_PC5
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip access-group ACL_HQ_USERS_IN in
 no ip proxy-arp
 no ip redirects
!
interface FastEthernet2/0.20
 description HQ_CORPORATE_VLAN20_GATEWAY_PC2_PC8
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 no ip proxy-arp
 no ip redirects
!
interface FastEthernet2/0.99
 description HQ_MANAGEMENT_VLAN99_GATEWAY_AUTO-SRV_JUMP-SRV_STATIC_ONLY
 encapsulation dot1Q 99
 ip address 10.10.99.1 255.255.255.0
 no ip proxy-arp
 no ip redirects
!
interface FastEthernet3/0
 description RESERVED_GROWTH_TRUNK_FOR_FUTURE_HQ_ACCESS_BLOCK
 no ip address
 shutdown
!
! ------------------------------------------------------------------ DHCP -----
!
ip dhcp excluded-address 10.10.10.1 10.10.10.20
ip dhcp excluded-address 10.10.20.1 10.10.20.20
ip dhcp excluded-address 10.10.99.1 10.10.99.20
!
ip dhcp pool VLAN10_HQ_USERS
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 10.20.30.10
 domain-name corp.local
 option 42 ip 10.20.30.11
 lease 2
!
ip dhcp pool VLAN20_HQ_CORP
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
 dns-server 10.20.30.10
 domain-name corp.local
 option 42 ip 10.20.30.11
 lease 2
!
! No pool for VLAN 99 - management VLAN is static-only by design. The
! excluded-address range above is retained so that a pool added there in future
! cannot hand out an address that collides with AUTO-SRV or JUMP-SRV.
!
! --------------------------------------------------------------- ROUTING -----
!
router ospf 1
 router-id 1.1.1.4
 log-adjacency-changes detail
 area 0 authentication message-digest
 passive-interface default
 no passive-interface FastEthernet0/0
 network 1.1.1.4 0.0.0.0 area 10
 network 10.255.0.8 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 10
 network 10.10.20.0 0.0.0.255 area 10
 network 10.10.99.0 0.0.0.255 area 10
!
! Only Fa0/0 is non-passive, so OSPF hellos are never sent onto a user or
! management VLAN. The VLAN prefixes are still advertised into area 10; what is
! suppressed is the ability of a host on those VLANs to form an adjacency.
!
! -------------------------------------------------- INFRASTRUCTURE SERVICES --
!
ip name-server 10.20.30.10
!
ntp server 10.20.30.11 prefer
ntp source Loopback0
ntp update-calendar
!
logging buffered 16384 informational
logging trap informational
logging origin-id hostname
logging source-interface Loopback0
logging host 10.20.30.12
!
! ----------------------------------------------------------- MANAGEMENT ------
!
banner login ^
MN521 Enterprise Network - AUTHORISED ACCESS ONLY
All access is logged to 10.20.30.12 and may be audited.
^
banner motd ^
HQ-DIST - HQ inter-VLAN routing / DHCP / OSPF ABR area 10
Unauthorized access prohibited
^
!
line console 0
 exec-timeout 15 0
 logging synchronous
 login local
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
