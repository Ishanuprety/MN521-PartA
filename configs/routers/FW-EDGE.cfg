!
hostname FW-EDGE
!
!
no ip domain-lookup
ip domain-name corp.local
!
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
!
service password-encryption
!
ip ssh version 2
!
line console 0
 login local
 logging synchronous
!
line vty 0 4
 login local
 transport input ssh
!

banner motd ^
MN521 Enterprise — FW-EDGE (Internet + DMZ firewall) — Unauthorized access prohibited
^
!
interface Loopback0
 description RID_FW-EDGE
 ip address 4.4.4.4 255.255.255.255
!
! Outside via ISP-Cloud L2 transit to Internet-NAT
interface FastEthernet0/0
 description OUTSIDE_TO_ISP-Cloud_Internet-NAT
 ip address dhcp
 ip nat outside
 no shutdown
!
! Inside link to HQ-CORE
interface FastEthernet1/0
 description INSIDE_TO_HQ-CORE_10.255.0.16/30
 ip address 10.255.0.17 255.255.255.252
 ip nat inside
 no shutdown
!
! DMZ trunk to SW-DMZ-1
interface FastEthernet2/0
 description TRUNK_TO_SW-DMZ-1
 no shutdown
!
interface FastEthernet2/0.60
 description DMZ_VLAN60
 encapsulation dot1Q 60
 ip address 10.60.60.1 255.255.255.0
 ip nat inside
!
ip dhcp excluded-address 10.60.60.1 10.60.60.20
!
ip dhcp pool VLAN60
 network 10.60.60.0 255.255.255.0
 default-router 10.60.60.1
 dns-server 10.20.30.10
!
! PAT for enterprise + DMZ toward Internet
ip access-list standard ACL_NAT
 permit 10.10.0.0 0.0.255.255
 permit 10.20.0.0 0.0.255.255
 permit 10.30.0.0 0.0.255.255
 permit 10.60.60.0 0.0.0.255
 permit 10.255.0.0 0.0.0.255
!
ip nat inside source list ACL_NAT interface FastEthernet0/0 overload
!
! Anti-spoof / edge ACL — do NOT deny entire 10/8 (breaks DHCP from some NAT clouds)
ip access-list extended ACL_OUTSIDE_IN
 deny ip 10.10.0.0 0.0.255.255 any log
 deny ip 10.20.0.0 0.0.255.255 any log
 deny ip 10.30.0.0 0.0.255.255 any log
 deny ip 10.60.60.0 0.0.0.255 any log
 deny ip 10.255.0.0 0.0.0.255 any log
 permit udp any any eq bootpc
 permit udp any any eq bootps
 permit icmp any any
 permit tcp any any established
 permit udp any any eq 53
 permit tcp any any eq 53
 permit tcp any host 10.60.60.10 eq 80
 permit tcp any host 10.60.60.10 eq 443
 permit tcp any host 10.60.60.11 eq 8080
 deny ip any any log
!
interface FastEthernet0/0
 ip access-group ACL_OUTSIDE_IN in
!
! DMZ isolation: allow web/app services outbound + DNS/NTP; limit east-west
ip access-list extended ACL_DMZ_IN
 permit udp 10.60.60.0 0.0.0.255 host 10.20.30.10 eq 53
 permit tcp 10.60.60.0 0.0.0.255 host 10.20.30.10 eq 53
 permit udp 10.60.60.0 0.0.0.255 host 10.20.30.11 eq 123
 permit icmp 10.60.60.0 0.0.0.255 any
 permit tcp 10.60.60.0 0.0.0.255 any eq 80
 permit tcp 10.60.60.0 0.0.0.255 any eq 443
 permit tcp 10.60.60.0 0.0.0.255 10.10.0.0 0.0.255.255 established
 permit tcp 10.60.60.0 0.0.0.255 10.20.0.0 0.0.255.255 established
 deny ip 10.60.60.0 0.0.0.255 10.10.99.0 0.0.0.255 log
 deny ip 10.60.60.0 0.0.0.255 10.20.30.0 0.0.0.255 log
 permit ip 10.60.60.0 0.0.0.255 any
 deny ip any any log
!
interface FastEthernet2/0.60
 ip access-group ACL_DMZ_IN in
!
ip route 0.0.0.0 0.0.0.0 FastEthernet0/0 dhcp
!
router ospf 1
 router-id 4.4.4.4
 log-adjacency-changes
 passive-interface default
 no passive-interface FastEthernet1/0
 network 4.4.4.4 0.0.0.0 area 0
 network 10.255.0.16 0.0.0.3 area 0
 network 10.60.60.0 0.0.0.255 area 0
 default-information originate
!
ip name-server 10.20.30.10
ntp server 10.20.30.11
logging host 10.20.30.12
logging trap informational
logging source-interface Loopback0
!

ip access-list extended ACL_VTY
 permit tcp 10.10.99.0 0.0.0.255 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny ip any any
!
line vty 0 4
 access-class ACL_VTY in
!

end
