!
hostname BR-EDGE
!
!
no ip domain-lookup
ip domain-name corp.local
!
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
!
service password-encryption
!
ip ssh version 2
!
line console 0
 login local
 logging synchronous
!
line vty 0 4
 login local
 transport input ssh
!

banner motd ^
MN521 Enterprise — BR-EDGE — Unauthorized access prohibited
^
!
interface Loopback0
 description RID_BR-EDGE
 ip address 3.3.3.3 255.255.255.255
!
interface FastEthernet0/0
 description WAN_PRIMARY_TO_DC-EDGE_10.255.0.4/30
 ip address 10.255.0.6 255.255.255.252
 no shutdown
!
! Direct to SW-BR-1 — shut to avoid L2 loop with SW-BR-DIST
interface FastEthernet1/0
 description RESERVED_TO_SW-BR-1_SHUT_NO_STP
 shutdown
!
! Backup WAN via WAN-Cloud to HQ-CORE
interface FastEthernet2/0
 description WAN_BACKUP_VIA_WAN-Cloud_TO_HQ-CORE_10.255.0.20/30
 ip address 10.255.0.22 255.255.255.252
 ip ospf cost 50
 no shutdown
!
! Primary ROAS trunk to SW-BR-DIST
interface FastEthernet3/0
 description TRUNK_TO_SW-BR-DIST
 no shutdown
!
interface FastEthernet3/0.40
 description BR_USERS_VLAN40
 encapsulation dot1Q 40
 ip address 10.30.40.1 255.255.255.0
!
interface FastEthernet3/0.50
 description BR_GUEST_VLAN50
 encapsulation dot1Q 50
 ip address 10.30.50.1 255.255.255.0
!
ip dhcp excluded-address 10.30.40.1 10.30.40.20
ip dhcp excluded-address 10.30.50.1 10.30.50.20
!
ip dhcp pool VLAN40
 network 10.30.40.0 255.255.255.0
 default-router 10.30.40.1
 dns-server 10.20.30.10
!
ip dhcp pool VLAN50
 network 10.30.50.0 255.255.255.0
 default-router 10.30.50.1
 dns-server 10.20.30.10
!
! Guest: allow DNS to DC but block mgmt/servers ICMP etc.
ip access-list extended ACL_GUEST
 permit udp 10.30.50.0 0.0.0.255 host 10.20.30.10 eq 53
 permit tcp 10.30.50.0 0.0.0.255 host 10.20.30.10 eq 53
 deny ip 10.30.50.0 0.0.0.255 10.10.99.0 0.0.0.255 log
 deny ip 10.30.50.0 0.0.0.255 10.20.30.0 0.0.0.255 log
 permit ip any any
!
interface FastEthernet3/0.50
 ip access-group ACL_GUEST in
!
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes
 passive-interface default
 no passive-interface FastEthernet0/0
 no passive-interface FastEthernet2/0
 network 3.3.3.3 0.0.0.0 area 30
 network 10.255.0.4 0.0.0.3 area 0
 network 10.255.0.20 0.0.0.3 area 0
 network 10.30.40.0 0.0.0.255 area 30
 network 10.30.50.0 0.0.0.255 area 30
!
ip name-server 10.20.30.10
ntp server 10.20.30.11
logging host 10.20.30.12
logging trap informational
logging source-interface Loopback0
!

ip access-list extended ACL_VTY
 permit tcp 10.10.99.0 0.0.0.255 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny ip any any
!
line vty 0 4
 access-class ACL_VTY in
!

end
