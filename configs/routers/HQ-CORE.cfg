!
hostname HQ-CORE
!
!
no ip domain-lookup
ip domain-name corp.local
!
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
!
service password-encryption
!
ip ssh version 2
!
line console 0
 login local
 logging synchronous
!
line vty 0 4
 login local
 transport input ssh
!

banner motd ^
MN521 Enterprise — HQ-CORE — Unauthorized access prohibited
^
!
interface Loopback0
 description RID_HQ-CORE
 ip address 1.1.1.1 255.255.255.255
!
! Link to FW-EDGE (NAT moved to FW — no DHCP/NAT here)
interface FastEthernet0/0
 description TO_FW-EDGE_10.255.0.16/30
 ip address 10.255.0.18 255.255.255.252
 no shutdown
!
interface FastEthernet1/0
 description WAN_PRIMARY_TO_DC-EDGE_10.255.0.0/30
 ip address 10.255.0.1 255.255.255.252
 no shutdown
!
interface FastEthernet2/0
 description TO_HQ-DIST_10.255.0.8/30
 ip address 10.255.0.9 255.255.255.252
 no shutdown
!
! Backup WAN via WAN-Cloud L2 transit to BR-EDGE
interface FastEthernet3/0
 description WAN_BACKUP_VIA_WAN-Cloud_TO_BR-EDGE_10.255.0.20/30
 ip address 10.255.0.21 255.255.255.252
 ip ospf cost 50
 no shutdown
!
! Default toward FW-EDGE for Internet
ip route 0.0.0.0 0.0.0.0 10.255.0.17
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 passive-interface Loopback0
 network 1.1.1.1 0.0.0.0 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.8 0.0.0.3 area 0
 network 10.255.0.16 0.0.0.3 area 0
 network 10.255.0.20 0.0.0.3 area 0
 default-information originate
!
ip name-server 10.20.30.10
ntp server 10.20.30.11
logging host 10.20.30.12
logging trap informational
logging source-interface Loopback0
!

ip access-list extended ACL_VTY
 permit tcp 10.10.99.0 0.0.0.255 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny ip any any
!
line vty 0 4
 access-class ACL_VTY in
!

end
