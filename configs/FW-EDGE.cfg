!
! ==============================================================================
! MN521 Part A - FW-EDGE (Cisco c7200, Dynamips)
! Role   : Internet edge and perimeter filter.
!          - only interface facing an untrusted network (Fa0/0 to Internet-NAT)
!          - PAT for all four internal zones
!          - static port translation publishing WEB-SRV:80 to the Internet
!          - DMZ gateway for VLAN 200 (semi-trusted zone)
!          - OSPF ASBR: sole originator of the default route
! Slots  : 0 = C7200-IO-FE (Fa0/0), 1/2/3 = PA-FE-TX (Fa1/0, Fa2/0, Fa3/0)
! Notes  : ASCII only, FastEthernet only, no exec-mode commands.
!          Generate the SSH host key after first boot - see README section
!          "Post-boot SSH enablement".
! ==============================================================================
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
hostname FW-EDGE
!
clock timezone AEST 10 0
!
enable secret Cisco123!
username admin privilege 15 secret Cisco123!
!
ip domain-name corp.local
ip domain-lookup
ip domain-lookup source-interface Loopback0
ip cef
!
no ip http server
no ip http secure-server
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
login on-failure log
login on-success log
!
archive
 log config
  logging enable
  hidekeys
  notify syslog contenttype plaintext
!
! ------------------------------------------------------------------ ACLs -----
! Defined before the interfaces and NAT statements that reference them, so the
! file replays cleanly top to bottom.
!
ip access-list standard ACL_NAT_INSIDE
 remark Enterprise zones translated by PAT toward the Internet
 remark WAN transit 10.255.0.0/24 is deliberately excluded - never translated
 permit 10.10.0.0 0.0.255.255
 permit 10.20.0.0 0.0.255.255
 permit 10.30.0.0 0.0.255.255
 permit 10.40.0.0 0.0.255.255
!
ip access-list extended ACL_VTY
 remark SSH from the named management hosts and the DC infrastructure VLAN only
 remark 10.10.99.10 = AUTO-SRV, 10.10.99.11 = reserved management jump host
 permit tcp host 10.10.99.10 any eq 22
 permit tcp host 10.10.99.11 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny   ip any any log
!
ip access-list extended ACL_INTERNET_IN
 remark Applied inbound on the untrusted edge. Allow-list, not deny-list.
 remark 1. RFC 2827 ingress filtering - our own space cannot arrive from outside
 deny   ip 10.10.0.0 0.0.255.255 any log
 deny   ip 10.20.0.0 0.0.255.255 any log
 deny   ip 10.30.0.0 0.0.255.255 any log
 deny   ip 10.40.0.0 0.0.255.255 any log
 deny   ip 10.255.0.0 0.0.255.255 any log
 deny   ip 127.0.0.0 0.255.255.255 any log
 deny   ip 169.254.0.0 0.0.255.255 any log
 remark 2. The one published service. Destination is the outside global address
 remark    because an inbound ACL is evaluated before outside-to-inside NAT.
 permit tcp any any eq www
 remark 3. Upstream DHCP offer for Fa0/0 - without this the interface never binds
 permit udp any eq bootps any eq bootpc
 remark 4. Return traffic for PAT sessions initiated from inside
 permit tcp any any established
 permit udp any any gt 1023
 permit udp any eq ntp any eq ntp
 permit icmp any any echo-reply
 permit icmp any any unreachable
 permit icmp any any time-exceeded
 remark 5. Everything else, including inbound management and inbound ping
 deny   ip any any log
!
ip access-list extended ACL_DMZ_IN
 remark Applied inbound on the DMZ gateway. The DMZ is semi-trusted: reachable
 remark from the Internet, but it must never initiate a session inward.
 permit udp any eq bootpc any eq bootps
 remark Management services the DMZ legitimately consumes, named individually
 permit udp 10.40.200.0 0.0.0.255 host 10.20.30.10 eq domain
 permit tcp 10.40.200.0 0.0.0.255 host 10.20.30.10 eq domain
 permit udp 10.40.200.0 0.0.0.255 host 10.20.30.11 eq ntp
 permit udp 10.40.200.0 0.0.0.255 host 10.20.30.12 eq syslog
 permit icmp 10.40.200.0 0.0.0.255 host 10.40.200.1
 remark No pivot from a compromised DMZ host into any trusted zone
 deny   ip 10.40.200.0 0.0.0.255 10.10.0.0 0.0.255.255 log
 deny   ip 10.40.200.0 0.0.0.255 10.20.0.0 0.0.255.255 log
 deny   ip 10.40.200.0 0.0.0.255 10.30.0.0 0.0.255.255 log
 deny   ip 10.40.200.0 0.0.0.255 10.255.0.0 0.0.255.255 log
 remark Internet egress, and replies to inbound sessions on the published port
 permit ip 10.40.200.0 0.0.0.255 any
 deny   ip any any log
!
! ------------------------------------------------------------ INTERFACES -----
!
interface Loopback0
 description ROUTER_ID_AND_LOGGING_SOURCE
 ip address 4.4.4.4 255.255.255.255
!
interface FastEthernet0/0
 description NAT_OUTSIDE_TO_INTERNET-NAT_CLOUD_UNTRUSTED
 ip address dhcp
 ip nat outside
 ip access-group ACL_INTERNET_IN in
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 no cdp enable
 no shutdown
!
interface FastEthernet1/0
 description WAN_TO_HQ-CORE_Fa0/0_10.255.0.12/30
 ip address 10.255.0.13 255.255.255.252
 ip nat inside
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 no ip proxy-arp
 no shutdown
!
interface FastEthernet2/0
 description TRUNK_802.1Q_TO_SW-DMZ_PORT0_VLAN_200
 no ip address
 no shutdown
!
interface FastEthernet2/0.200
 description DMZ_VLAN200_GATEWAY_WEB-SRV_PC-DMZ
 encapsulation dot1Q 200
 ip address 10.40.200.1 255.255.255.0
 ip nat inside
 ip access-group ACL_DMZ_IN in
 no ip proxy-arp
 no ip redirects
 no cdp enable
!
interface FastEthernet3/0
 description RESERVED_SECOND_ISP_UPLINK_SEE_TOPOLOGY_APPENDIX
 no ip address
 shutdown
!
! ------------------------------------------------------------------ DHCP -----
!
ip dhcp excluded-address 10.40.200.1 10.40.200.20
!
ip dhcp pool VLAN200_DMZ
 network 10.40.200.0 255.255.255.0
 default-router 10.40.200.1
 dns-server 10.20.30.10
 domain-name dmz.corp.local
 lease 0 8
!
! --------------------------------------------------------------- ROUTING -----
!
router ospf 1
 router-id 4.4.4.4
 log-adjacency-changes detail
 area 0 authentication message-digest
 passive-interface default
 no passive-interface FastEthernet1/0
 network 4.4.4.4 0.0.0.0 area 0
 network 10.255.0.12 0.0.0.3 area 0
 network 10.40.200.0 0.0.0.255 area 40
 default-information originate always
!
! FW-EDGE is the only router in the domain that originates a default route.
! The upstream default itself is installed by the Fa0/0 DHCP lease; "always"
! keeps the domain default stable across a lease renewal.
!
! ------------------------------------------------------------------- NAT -----
!
! Dynamic PAT: every internal zone shares the single DHCP-learned outside
! address. Inside interfaces are Fa1/0 and Fa2/0.200 - note the subinterface,
! not the parent trunk, because NAT domain membership follows the IP address.
ip nat inside source list ACL_NAT_INSIDE interface FastEthernet0/0 overload
!
! Static port translation: publish the DMZ web service on the outside address.
ip nat inside source static tcp 10.40.200.10 80 interface FastEthernet0/0 80
!
! -------------------------------------------------- INFRASTRUCTURE SERVICES --
!
ip name-server 10.20.30.10
!
ntp server 10.20.30.11 prefer
ntp source Loopback0
ntp update-calendar
!
logging buffered 16384 informational
logging trap informational
logging source-interface Loopback0
logging host 10.20.30.12
!
! ------------------------------------------------- OPTIONAL: STATEFUL EDGE ---
!
! The baseline edge policy above is a stateless allow-list: return traffic is
! matched by "established" and by high destination ports rather than by session
! state. A genuinely stateful edge is available on this platform through CBAC.
! It is left commented out because session tracking is expensive on emulated
! MIPS hardware shared with four other Dynamips instances, and because Part A
! does not require it. See docs/REVIEW_FINDINGS.md R-25.
!
! To enable it, uncomment the block below and replace items 3 and 4 of
! ACL_INTERNET_IN with "deny ip any any log" - CBAC then opens the return
! pinholes dynamically:
!
! ip inspect name FW_STATEFUL tcp timeout 3600
! ip inspect name FW_STATEFUL udp timeout 30
! ip inspect name FW_STATEFUL icmp timeout 10
! ip inspect name FW_STATEFUL http
! ip inspect name FW_STATEFUL dns
! !
! interface FastEthernet0/0
!  ip inspect FW_STATEFUL out
!
! ----------------------------------------------------------- MANAGEMENT ------
!
banner login ^
MN521 Enterprise Network - AUTHORISED ACCESS ONLY
All access is logged to 10.20.30.12 and may be audited.
^
banner motd ^
FW-EDGE - Internet edge / PAT / DMZ gateway / OSPF ASBR - Unauthorized access prohibited
^
!
line console 0
 exec-timeout 15 0
 logging synchronous
 login local
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
