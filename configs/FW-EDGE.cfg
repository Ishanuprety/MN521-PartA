!
! ==============================================================================
! MN521 Part A - FW-EDGE (Cisco c7200, Dynamips)
!
! Role   : Internet edge firewall and the only device facing an untrusted
!          network. Owns:
!            - PAT for all enterprise zones (Fa0/0 outside, DHCP from ISP path)
!            - static port translations publishing WEB-SRV:80 and APP-SRV:8080
!            - the perimeter ingress filter (ACL_OUTSIDE_IN)
!            - the DMZ gateway for VLAN 60 (10.60.60.0/24) and its egress filter
!            - sole origination of the default route into OSPF (ASBR)
!
! Slots  : 0 = C7200-IO-FE (Fa0/0), 1/2/3 = PA-FE-TX (Fa1/0, Fa2/0, Fa3/0)
! Path   : Fa0/0 -> ISP-Cloud (L2 transit) -> Internet-NAT
!          Fa1/0 -> HQ-CORE Fa0/0 over 10.255.0.16/30
!          Fa2/0 -> SW-DMZ-1 802.1Q trunk, VLAN 60 tagged
!
! Notes  : ASCII only. FastEthernet only. No exec-mode commands - generate the
!          SSH RSA host key after first boot (docs/APPLY_STEPS.md step 2).
!          Each interface and each line range appears exactly once, and every
!          ACL is defined before the interface that references it, so the file
!          replays cleanly top to bottom.
! ==============================================================================
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
hostname FW-EDGE
!
clock timezone AEST 10 0
!
enable secret Cisco123!
username admin privilege 15 secret Cisco123!
!
ip domain-name corp.local
ip domain-lookup
ip domain-lookup source-interface Loopback0
ip cef
!
no ip http server
no ip http secure-server
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
login on-failure log
login on-success log
!
archive
 log config
  logging enable
  hidekeys
  notify syslog contenttype plaintext
!
! ------------------------------------------------------------------ ACLs -----
!
ip access-list standard ACL_NAT
 remark Zones translated by PAT toward the Internet.
 remark WAN transit 10.255.0.0/24 is deliberately NOT translated: those are
 remark point-to-point router addresses that never source Internet traffic.
 permit 10.10.0.0 0.0.255.255
 permit 10.20.0.0 0.0.255.255
 permit 10.30.0.0 0.0.255.255
 permit 10.60.60.0 0.0.0.255
!
ip access-list extended ACL_VTY
 remark SSH accepted only from the named management hosts and the DC server VLAN.
 remark 10.10.99.10 = AUTO-SRV (Ansible), 10.10.99.11 = JUMP-SRV (bastion).
 remark The DC VLAN keeps subnet-level access as a deliberate break-glass path.
 permit tcp host 10.10.99.10 any eq 22
 permit tcp host 10.10.99.11 any eq 22
 permit tcp 10.20.30.0 0.0.0.255 any eq 22
 deny   ip any any log
!
ip access-list extended ACL_OUTSIDE_IN
 remark Perimeter ingress filter, applied inbound on Fa0/0. Allow-list: it ends
 remark in an explicit deny, so anything not named below is dropped and counted.
 remark
 remark 1. RFC 2827 anti-spoofing - our own address space cannot arrive from
 remark    outside. Enumerated per zone rather than as 10.0.0.0/8, because a
 remark    GNS3 NAT cloud on a 10.x host network would otherwise have its own
 remark    DHCP offer dropped and the outside interface would never bind.
 deny   ip 10.10.0.0 0.0.255.255 any log
 deny   ip 10.20.0.0 0.0.255.255 any log
 deny   ip 10.30.0.0 0.0.255.255 any log
 deny   ip 10.60.60.0 0.0.0.255 any log
 deny   ip 10.255.0.0 0.0.0.255 any log
 deny   ip 127.0.0.0 0.255.255.255 any log
 deny   ip 169.254.0.0 0.0.255.255 any log
 remark 2. Published DMZ services. The destination here is the OUTSIDE GLOBAL
 remark    address, not 10.60.60.x, because an inbound ACL on a NAT outside
 remark    interface is evaluated BEFORE outside-to-inside translation.
 permit tcp any any eq www
 permit tcp any any eq 8080
 remark 3. The upstream DHCP offer for Fa0/0. With a closing deny this is
 remark    unsolicited inbound traffic and must be permitted explicitly.
 permit udp any eq bootps any eq bootpc
 remark 4. Return traffic for sessions initiated from inside through PAT.
 permit tcp any any established
 permit udp any any gt 1023
 permit udp any eq ntp any eq ntp
 permit icmp any any echo-reply
 permit icmp any any unreachable
 permit icmp any any time-exceeded
 remark 5. Everything else, including inbound SSH/Telnet/SNMP and inbound ping
 remark    to the public address, is denied by design.
 deny   ip any any log
!
ip access-list extended ACL_DMZ_IN
 remark DMZ egress filter, applied inbound on Fa2/0.60. The DMZ is SEMI-TRUSTED:
 remark it is reachable from the Internet, so it must be treated as the most
 remark likely place to be compromised, and it must never be able to open a
 remark session into a trusted zone.
 permit udp any eq bootpc any eq bootps
 remark Infrastructure services the DMZ legitimately consumes, named per host
 remark and per port, above the zone denies.
 permit udp 10.60.60.0 0.0.0.255 host 10.20.30.10 eq domain
 permit tcp 10.60.60.0 0.0.0.255 host 10.20.30.10 eq domain
 permit udp 10.60.60.0 0.0.0.255 host 10.20.30.11 eq ntp
 permit udp 10.60.60.0 0.0.0.255 host 10.20.30.12 eq syslog
 permit icmp 10.60.60.0 0.0.0.255 host 10.60.60.1
 remark Replies to clients that reached the published services are allowed, but
 remark a DMZ-initiated session into a trusted zone is not.
 permit tcp 10.60.60.0 0.0.0.255 any established
 permit icmp 10.60.60.0 0.0.0.255 any echo-reply
 remark No pivot inward. Every trusted zone is denied by name - adding a zone to
 remark the network means adding it here (see docs/REVIEW_FINDINGS.md R-07).
 deny   ip 10.60.60.0 0.0.0.255 10.10.0.0 0.0.255.255 log
 deny   ip 10.60.60.0 0.0.0.255 10.20.0.0 0.0.255.255 log
 deny   ip 10.60.60.0 0.0.0.255 10.30.0.0 0.0.255.255 log
 deny   ip 10.60.60.0 0.0.0.255 10.255.0.0 0.0.0.255 log
 remark Internet egress, so DMZ hosts can be patched.
 permit ip 10.60.60.0 0.0.0.255 any
 deny   ip any any log
!
! ------------------------------------------------------------ INTERFACES -----
!
interface Loopback0
 description RID_FW-EDGE_AND_LOGGING_SOURCE
 ip address 4.4.4.4 255.255.255.255
!
interface FastEthernet0/0
 description OUTSIDE_VIA_ISP-Cloud_TO_Internet-NAT_UNTRUSTED
 ip address dhcp
 ip nat outside
 ip access-group ACL_OUTSIDE_IN in
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 no cdp enable
 no shutdown
!
interface FastEthernet1/0
 description INSIDE_TO_HQ-CORE_Fa0/0_10.255.0.16/30
 ip address 10.255.0.17 255.255.255.252
 ip nat inside
 ip ospf message-digest-key 1 md5 MN521-OSPF-K1
 no ip proxy-arp
 no shutdown
!
interface FastEthernet2/0
 description TRUNK_802.1Q_TO_SW-DMZ-1_Eth0_VLAN_60_TAGGED
 no ip address
 no shutdown
!
interface FastEthernet2/0.60
 description DMZ_VLAN60_GATEWAY_WEB-SRV_APP-SRV_PC-DMZ
 encapsulation dot1Q 60
 ip address 10.60.60.1 255.255.255.0
 ip nat inside
 ip access-group ACL_DMZ_IN in
 no ip proxy-arp
 no ip redirects
 no cdp enable
!
interface FastEthernet3/0
 description RESERVED_SECOND_ISP_UPLINK_HELD_DOWN_UNTIL_COMMISSIONED
 no ip address
 shutdown
!
! ------------------------------------------------------------------ DHCP -----
!
ip dhcp excluded-address 10.60.60.1 10.60.60.20
!
! DMZ servers are statically addressed in .10-.19; this pool serves PC-DMZ and
! any transient maintenance host. A distinct domain name makes a DMZ lease
! self-evident on the client, and no option 42 is offered because DMZ hosts take
! time from the router-reachable NTP server via explicit ACL permit, not DHCP.
ip dhcp pool VLAN60_DMZ
 network 10.60.60.0 255.255.255.0
 default-router 10.60.60.1
 dns-server 10.20.30.10
 domain-name dmz.corp.local
 lease 0 8
!
! --------------------------------------------------------------- ROUTING -----
!
router ospf 1
 router-id 4.4.4.4
 log-adjacency-changes detail
 area 0 authentication message-digest
 passive-interface default
 no passive-interface FastEthernet1/0
 network 4.4.4.4 0.0.0.0 area 0
 network 10.255.0.16 0.0.0.3 area 0
 network 10.60.60.0 0.0.0.255 area 0
 default-information originate always
!
! FW-EDGE is the ONLY router that originates a default route. HQ-CORE must not
! also originate one: two ASBRs would put a second O*E2 0.0.0.0/0 in the domain
! pointing at a router with no Internet path. See docs/REVIEW_FINDINGS.md R-04.
!
! "always" is used because the upstream default is learned from a DHCP lease
! whose renewal timing is outside our control; it keeps the domain default
! stable across a renewal instead of black-holing all four zones.
!
! The DMZ stays in area 0 rather than becoming its own area. Fa2/0.60 is
! FW-EDGE's only non-backbone segment, so a separate area would make this router
! an ABR generating type-3 summaries for a single /24 - LSDB complexity with no
! scaling benefit. It is passive, so no adjacency can form on the DMZ.
!
! ------------------------------------------------------------------- NAT -----
!
! Dynamic PAT: every internal zone shares the one DHCP-learned outside address.
ip nat inside source list ACL_NAT interface FastEthernet0/0 overload
!
! Static port translations publishing the DMZ services. Without these the
! permits in ACL_OUTSIDE_IN have nothing to translate to and inbound sessions
! are dropped after passing the ACL. Note "ip nat inside" is on Fa2/0.60, the
! subinterface that owns the address, not on the parent trunk.
ip nat inside source static tcp 10.60.60.10 80 interface FastEthernet0/0 80
ip nat inside source static tcp 10.60.60.11 8080 interface FastEthernet0/0 8080
!
! -------------------------------------------------- INFRASTRUCTURE SERVICES --
!
ip name-server 10.20.30.10
!
ntp server 10.20.30.11 prefer
ntp source Loopback0
ntp update-calendar
!
logging buffered 16384 informational
logging trap informational
logging origin-id hostname
logging source-interface Loopback0
logging host 10.20.30.12
!
! ------------------------------------------------- OPTIONAL: STATEFUL EDGE ---
!
! The filter above is an allow-list but it is still STATELESS: return traffic is
! matched structurally ("established", high destination ports, three ICMP types)
! rather than against a session table. CBAC provides genuine stateful inspection
! on this platform. It is left commented out because session tracking is costly
! on emulated MIPS shared with four other Dynamips instances, and Part A does not
! require it. See docs/REVIEW_FINDINGS.md R-19.
!
! To enable: uncomment below and replace items 3 and 4 of ACL_OUTSIDE_IN with a
! single "deny ip any any log" - CBAC then opens the return pinholes per session.
!
! ip inspect name FW_STATEFUL tcp timeout 3600
! ip inspect name FW_STATEFUL udp timeout 30
! ip inspect name FW_STATEFUL icmp timeout 10
! ip inspect name FW_STATEFUL http
! ip inspect name FW_STATEFUL dns
! !
! interface FastEthernet0/0
!  ip inspect FW_STATEFUL out
!
! ----------------------------------------------------------- MANAGEMENT ------
!
banner login ^
MN521 Enterprise Network - AUTHORISED ACCESS ONLY
All access is logged to 10.20.30.12 and may be audited.
^
banner motd ^
FW-EDGE - Internet edge firewall / PAT / DMZ VLAN 60 / OSPF ASBR
Unauthorized access prohibited
^
!
line console 0
 exec-timeout 15 0
 logging synchronous
 login local
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class ACL_VTY in
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
