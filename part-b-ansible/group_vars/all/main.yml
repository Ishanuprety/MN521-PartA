---
# Values common to the whole enterprise (single source of truth)
org_name: MN521 Group 3
domain_name: corp.local
dns_server: 10.20.30.10

# Central services in DC VLAN 30
ntp_servers:
  - 10.20.30.11
syslog_servers:
  - 10.20.30.12

# Login banner (MOTD) - same text Part A deployed
banner_motd: |-
  MN521 Part A b
  Authorized access only

# SSH / VTY hardening
ssh_version: 2
ssh_timeout: 60
ssh_auth_retries: 2
vty_exec_timeout: "15 0"
vty_acl: ACL_VTY

# Management subnets allowed to SSH to the routers
mgmt_subnets:
  - { net: 10.10.99.0, wildcard: 0.0.0.255, name: HQ management VLAN 99 }
  - { net: 10.20.30.0, wildcard: 0.0.0.255, name: DC server VLAN 30 }

# Where the automation writes its evidence (relative to the project root)
backup_dir: "{{ playbook_dir }}/backups"
report_dir: "{{ playbook_dir }}/reports"
# Date stamp used in backup file names and report headers (control-node clock)
run_date: "{{ lookup('ansible.builtin.pipe', 'date +%Y-%m-%d') }}"
