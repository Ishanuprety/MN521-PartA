---
# MN521 Group 3 - enterprise inventory (Part A lab, GNS3)
# Management address of every router = its Loopback0, reached from the
# control node AUTO-SRV (VLAN 99) via OSPF; ACL_VTY admits 10.10.99.0/24 on tcp/22.
all:
  children:
    routers:
      children:
        hq:
          hosts:
            HQ-CORE:
              ansible_host: 1.1.1.1
            HQ-DIST:
              ansible_host: 1.1.1.4
        dc:
          hosts:
            DC-EDGE:
              ansible_host: 2.2.2.2
        branch:
          hosts:
            BR-EDGE:
              ansible_host: 3.3.3.3
        edge:
          hosts:
            FW-EDGE:
              ansible_host: 4.4.4.4
