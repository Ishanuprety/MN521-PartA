---
- name: SSH | SSHv2, timers and VTY access (SSH only, ACL-protected)
  cisco.ios.ios_config:
    src: ssh.j2
  notify: save config

- name: SSH | read SSH server state
  cisco.ios.ios_command:
    commands: show ip ssh
  register: ssh_state
  changed_when: false

- name: SSH | assert SSH version 2 is enabled
  ansible.builtin.assert:
    that: "'SSH Enabled - version 2.0' in ssh_state.stdout[0]"
    success_msg: "{{ inventory_hostname }}: {{ ssh_state.stdout_lines[0][0] }}"
    fail_msg: "{{ inventory_hostname }}: SSHv2 is NOT enabled"
    quiet: true
