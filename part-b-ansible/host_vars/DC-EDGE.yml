---
device_role: DC gateway (VLAN 30 servers), ABR area 0-20
loopback0: 2.2.2.2
vlans:
  # VLAN 30 is untagged on a routed port towards SW-DC-1
  - { id: 30, name: DC_SERVERS, interface: FastEthernet2/0, ip: 10.20.30.1, mask: 255.255.255.0,
      dot1q: false, description: ACCESS_VLAN30_TO_SW-DC-1 }
ospf:
  router_id: 2.2.2.2
  passive_interfaces: [FastEthernet2/0]
  networks:
    - { net: 2.2.2.2,    wildcard: 0.0.0.0,   area: 0 }
    - { net: 10.20.30.0, wildcard: 0.0.0.255, area: 20 }
    - { net: 10.255.0.0, wildcard: 0.0.0.3,   area: 0 }
    - { net: 10.255.0.4, wildcard: 0.0.0.3,   area: 0 }
  default_originate: false
ospf_expected_neighbors: [1.1.1.1, 3.3.3.3]
acl_expected_applied: [ACL_DC_IN]
